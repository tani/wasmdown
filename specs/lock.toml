[spec.wasi.providers]
clocks     = "implemented: monotonic/system now + get-resolution (clock_gettime); wait-until/wait-for declared-unsupported (host-error); clocks-timezone @unstable-gated off"
random     = "implemented: secure + insecure forms from /dev/urandom, never CL:RANDOM; 1 MiB short-read cap"
cli        = "implemented: environment, arguments, initial-cwd, exit/exit-with-code, stdio streams, terminal-* (isatty), wasi:cli/run (ok->0, err->1, wasi-exit status)"
filesystem = "implemented: preopen capability model (every op *at, O_NOFOLLOW walk, 32-link budget, absolute/.. refused, non-owning preopens), descriptor resource + 25 methods + errno->error-code, read/write/append-via-stream (pread/pwrite, no shared offset), read-directory"
sockets    = "implemented: wasi-network authority (outbound/listen/dns), tcp-socket, udp-socket (shared-ownership refs), ip-name-lookup, errno->sockets-error-code; no reactor (bounded 2 s readiness poll); the pinned WIT has no network resource/shutdown/@unstable"
http       = "NOT IMPLEMENTED BY DESIGN (permanent exclusion, user decision 2026-11-02; PLAN.md M16 slice 5 / M17): no provider, no HTTP/TLS adapter, no transport option. The vendored wasi-wit-0.3.2/http/ WIT is reference data only. A component-declared wasi:http import (any interface, any version, P2 or P3) is refused at link time with the exact message in specs/wasi/MANIFEST.md. Recoverable from git history; not pending and not a gap."
not_implemented = "wasi:http (all interfaces/worlds, both the 0.2 facade and 0.3.2; permanent exclusion, not an implementation gap) and network communication (wasi:sockets TCP/UDP/DNS). The WASI 0.2 facade is implemented separately under [spec.wasi.preview2]."
status     = "0.3.2 provider surface implemented for the declared profile (wasi:http and wasi:sockets excluded permanently); the §9.3 defect register has no open row (nested async payload ownership, dtor/lend reclamation, compound-result audit, @unstable gating, validator type-use limits all closed 2026-11-02). Remaining evidence gaps are the upstream toolchain guest / wasi-testsuite lane (adapter registered 2026-11-02; recorded blocker: the precompiled @0.3.2 guests mix WASI release lines, so 22 of the 23 admitted wasip3 tests are refused at LINK) and the deterministic async property lane + blocked-stdio executor audit."
gates      = "units 605/0 (556 baseline + 20 Preview1 + 2 WIT-loader + 7 store + 5 P2-artifact + 13 P2-provider + 3 upstream-lane SIMD regressions incl. the OOB-trap pin); core 21187/0/73; component lane 1631/0/0/0 (the lane metric; the probe metric retains the pre-existing, machine-load-dependent async flake class)"
preview1   = "implemented: all 46 wasi_snapshot_preview1 imports (src/wasi-preview1.lisp), ABI memory gate in BEFORE-START, rights/preopen confinement with version-neutral `..`, poll_oneoff clock normalization, proc_raise->NOTSUP (named limitation); CLI `run --wasi` + `--`; SQLite 3.54.1 shell executes and persists through a preopen (tests/fixtures/wasi/, tools/build-wasi-fixtures.sh)"
store      = "COMPLETE (PLAN.md step 2). component-store owns the instantiation graph: make-component-store + :store/:outer ownership (a cross-store instantiation is a link-error) + component-instance-store + call-with-component-store + per-store store-teardown + the *store-run-hook* script boundary. Every execution-state slot is the store's own: tok-path-counter, tok-skip-age, async-progress, cancel-window-inst, defer-resume-all(-tasks), right-handoffs, right-driver, driver-records, the scheduler thread registry (component-store-threads), the execution RIGHT and its ticket/owner/owner-os, and the instance-keyed caches comp-closure, resource-dtor-table, ct-defining-inst. Only the locks stay process-wide (*store-right*, *scheduler-mutex*): they serialize the protocol, not any state. Two bindings make the model honest: instantiate-component binds the graph's store for the whole walk, and lifted-func-call binds the CALLEE instance's store (without it the caller's tick and the callee's threads split across two stores — demonstrated by component/live-borrow-blocks-task-return-pin before the binding landed). store-teardown descends nothing outside the named store. Public accessors: component-store-threads, component-store-right-ticket, component-store-right-owner; run-component returns (values status store) so a caller can prove the teardown left nothing registered. Pins: tests/component-store.lisp (8 cases, incl. scheduler-state-is-per-store) + the 10 scheduler pins now run in a fresh store via pin-test/%pin-in-store."
step4      = "COMPLETE. One numbering system is in the tree: only type-sort declarators (type, type aliases, type-bound imports/exports) introduce a type index (Binary.md 274) — producer (text parser), validator cval, every consumer table, the M9 functype remap and the binary decoder all use it. Landed by gating the migration behind wasmdown.component::*spec-declarator-indexing*, driving that path to 599/0 unit + 1631 GREEN component + 21187 core + 14/14 P1 acceptance, then deleting the flag and the four legacy twins (%ict-type-space-legacy, %instance-ct-ids-legacy, %ct-decl-at-legacy, %declarator-space-legacy); no shipped behavior depends on a switch. Two follow-on fixes the migration required: non-type declarator bind-ids now occupy their OWN sort's index space (%alloc) instead of a type slot, and the validator's cval push is type-only. Also fixed a latent test-infrastructure defect found by the new numbering: SBCL's default *RANDOM-STATE* is deterministic in this build, so (random most-positive-fixnum) temp names repeated across processes and reused stale /tmp directories; p1-temp-dir and the wit/P2 fixtures now use sb-posix:mkdtemp."

preview2   = "PARTIAL (27 of 31 stable interfaces bound): src/wasi-preview2.lisp provides the versioned provider registry (exact import names, one parsed package set per release), preview2-command-world, preview2-command-provider, run-preview2 (with :mode threaded to embedded cores), and providers for wasi:io {error,poll,streams}, wasi:clocks {monotonic-clock,wall-clock}, wasi:random {random,insecure,insecure-seed} and wasi:cli {environment,exit,stdin,stdout,stderr,terminal-input,terminal-output,terminal-stdin,terminal-stdout,terminal-stderr}. Stability gating is real: exit-with-code is exported at 0.2.12 and withheld at 0.2.11 (@unstable there). provider-instance gained an :include predicate for that. wasi:filesystem {types,preopens} is bound too: 28 descriptor methods (streams, positional read/write, directory-entry-stream, stat/hash/times/links/rename/symlink/open-at, error downcast), reusing the native descriptor operations with the 0.2 value shapes (descriptor-type is an ENUM in 0.2, a VARIANT in 0.3 — normalized). The WIT resolver learned to follow re-exported resources (io/streams re-exports io/error) and to synthesize a world's resource table. wasi:sockets is bound too (network, instance-network, ip-name-lookup, tcp, tcp-create-socket, udp, udp-create-socket): 0.2's start/finish phase model over the shared native nonblocking sockets, TCP loopback connect/accept with stream tuples, UDP datagram streams with send/receive, DNS resolution behind the network authority, per-resource subscriptions, option knobs and shutdown. Every interface the `wasi:cli/command` world imports now has a provider (27 providers compose). The implicit `[resource-drop]R` export is synthesised for every imported resource (a component that imports an interface instance imports its drops as functions). NOT yet bound: wasi:http (3). REAL-RUN STATE: preview2-command-provider composes 27 providers and run-preview2 now instantiates the adapter-produced SQLite P2 component, allocates resources and issues host calls (monotonic now, stdio handles, args, environment); it then fails lowering `option<string>`-shaped values because the component's TYPE INDICES are still resolved through the phantom-slot declarator space (step 4), i.e. P2 execution is blocked on step 4, not on a missing provider. Previously recorded state: the versioned WIT loader + pins are in place (specs/wasi/index.txt, wasi-package(-files) with :version, parse-wit-directory/parse-wit-files); the wasi:*@0.2.x provider registry, CLI/P2 worlds, resource surfaces and the 0.2 HTTP client/service are still outstanding"

[suite.wasi-testsuite]
name        = "WASI testsuite (upstream precompiled guest binaries)"
repo        = "https://github.com/WebAssembly/wasi-testsuite"
branch      = "prod/testsuite-base"
commit      = "9d84631e427729802085c3d172d0a63cd360a1fa"
commit_date = "2026-10-30"
not_vendored = "the tree (127 precompiled guests: rust 46+55, c 14, assemblyscript 12) is fetched by the developer, never committed"
layout      = "tests/<lang>/testsuite/<abi>/manifest.json + *.wasm + *.json; run-tests + test-runner/ (colorama, requests)"
runner      = "python3 run-tests --runtime-adapter <repo>/adapters/wasmdown.py --expectations <generated> --json-output-location <tmp> --disable-colors"
driver      = "tools/run-wasi-testsuite.py (make test-wasi-upstream); verifies git HEAD == commit, generates the declared-exclusion expectations, writes tests/wasi-upstream-results.json + tests/wasi-upstream-summary.md"
guest_toolchain = "upstream precompiled binaries at the pinned commit; no local toolchain in this environment emits @0.3.2 (no cargo/rustc/wasm-tools), and the precompiled @0.3.2 guests mix WASI release lines, which the runtime refuses at link time"
verify      = "WASI_TESTSuite_DIR=<path> python3 tools/run-wasi-testsuite.py (refuses any tree whose HEAD differs from the commit above)"
note        = "PLAN.md §9.3 F1: registered adapter + reproducible lane. Measured at this commit (127 guests): 28 pass / 67 fail / 32 declared skips. wasm32-wasip3 = 2 pass / 23 fail / 30 skips: 22 mixed-release-line LINK refusals + 1 validation error. wasm32-wasip1 = 26 pass / 44 fail / 2 skips (the legacy sock_shutdown-* network exclusion): 42 failures share the path_open/oflags::directory EISDIR defect. Not a release gate."

[toolchain]
sbcl        = "2.6.4"
architecture = "linux-aarch64 (dev); x86-64 primary per PLAN.md §1"
lisp_deps   = "0 mandatory Quicklisp/third-party"
wasi_0_3    = "not pinned (recorded blocker, PLAN.md §9.3 F1): no cargo/rustc/wasm-tools in this environment, so no local build emits @0.3.2; the upstream precompiled guests pinned in [suite.wasi-testsuite] are the only @0.3.2 source, and they mix @0.3.2 with @0.2.9 imports, which the runtime refuses at link time"

[tooling.dev-only]
wabt        = "not pinned (test-only wast2json allowed per PLAN.md §12.2)"
wasm_tools  = "not pinned"
wasmtime    = "not pinned"

[status]
declared_support = "partial"
note = "Engine executes core subset: MVP + bulk-memory + sign-ext + non-trapping-float + multi-value + reference types + tail calls (return_call/return_call_indirect) + exception handling (tags, try_table, throw) + typed function references ((ref $t)/(ref null $t), call_ref/return_call_ref/br_on_null/br_on_non_null/ref.as_non_null, definite initialization) + rec type groups with canonicalization + iso-recursive equivalence + GC values END TO END (struct/array declarations AND opcodes: struct.new/get/set with packed normalization, array.* family, i31, ref.cast/ref.test/br_on_cast, ref.eq, any<->extern — self-authored tests; no vendored fixture) + multi-memory runtime + memory64 (memidx immediates on every memory op, cross-memory copy, i64 addressing — self-authored tests; no vendored fixture) + named module definition/instance script forms. The vendored core suite (97 files, pinned b0ec1f3f) is fully attributed: 21187 pass / 0 fail / 73 unsupported (annotations 73 = unadopted proposal, 1 SIMD fixture). NOT Core 3.0 conformant; still out of scope: threads/atomics, FASL cache, annotations (unadopted proposal), the WASI 0.1/0.2 facades. The Component Model / Canonical ABI (M7-M15, the component lane 1631/0/0/0) and the WASI 0.3.2 host providers (M16, slice-scoped; see [spec.wasi] and its residuals) ARE implemented. SIMD (v128 + relaxed SIMD) IS implemented as of loop 24: valtype v128 (0x7B), the full 0xFD opcode family per BinarySIMD.md (236 v128 ops) plus the relaxed 0x100..0x113 set per the relaxed-simd Overview — text (v128.const shape literals, lane immediates, memarg+lane pairs, shuffle), binary decode/encode (u32-LEB sub-opcodes; the relaxed values multi-byte), validation (per-op signatures, lane bounds, addrtype-aware memarg checks), interp (scalarized lane execution over the one-object byte-vector representation, memory ops via the runtime's bounds-checked loads/stores). Relaxed ops implement the canonical deterministic member of each spec-sanctioned outcome set (documented per op at src/simd.lisp's exec + tests/simd.lisp pins): relaxed swizzle OOB=0, madd/nmadd plain two-rounding, min/max = non-relaxed fmin/fmax, q15mulr saturating, laneselect = bitselect, dot = 7-bit-unsigned b reading, relaxed trunc = saturating. Vendored coverage: obsolete-keywords::10 now PASSES at decode (21187/0/73); the rest of the SIMD surface is pinned by tests/simd.lisp (self-authored)."

step7      = "LANES LANDED. (a) CENSUS: tools/run-component-census.sh + `make test-component-census` run the component lane N times (default 30) in fresh processes and fail unless EVERY run is GATE: GREEN with the pinned 1631-command denominator (a shrinking denominator, any fail/herr/timeout/skip, or a non-green gate is RED). MEASURED 2026-10-31 on this tree: CENSUS GREEN 30/30, 1631 commands per run, 0 fail / 0 harness-error / 0 timeout, walls 9.99-10.39 s. (b) UPSTREAM ADAPTER: tools/run-upstream-testsuite.py fetches WebAssembly/testsuite at an exact commit (default: the lock pin; SHA-256 recorded in tests/upstream-testsuite/.pin.json), runs the scripts through tools/run-upstream-wast.lisp (pattern/jsonl/suite from the environment) and writes tests/upstream-results.jsonl + CONFORMANCE-UPSTREAM.md. It is a DISCOVERY lane, never a gate (PLAN.md 12.9): proposal corpora beyond the declared scope are measured, not counted against the pinned core suite. (c) The adapter immediately exposed and drove four real fixes: WAST v128.const parsing, v128 lane-wise expectations with nan:canonical/nan:arithmetic lanes, the (either ...) sanctioned-set wrapper, and the module parser's i8x16/i16x8 v128.const shapes with masked integer lanes. Measured after the fixes at mirror 63908677d005 (2026-10-31): 65,135 commands, 61,897 pass, 3,064 fail, 101 harness-error, 73 unsupported; the residual classes are named in CONFORMANCE-UPSTREAM.md (memory64 module loads, ref_eq/ref_test, relaxed-SIMD edge cases remain)."
simd-cmp   = "FIXED (found by the upstream lane): the six float lanewise comparisons (f32x4/f64x2 eq/ne/lt/gt/le/ge) ran through the float map, which fed the all-ones mask back into F32BITS and trapped on the first v128 assertion; they now produce masks through %FCM2. The same lane exposed the missing v128 expectation forms (see step7). Verified: upstream pass 55,208 -> 61,849 with no local regression (units 602/0, core 21,187/0/73, component 1,631 GREEN)."
p2-exec    = "WORKS end to end, in memory AND on disk (2026-10-31). tests/fixtures/wasi/sqlite3-p2.wasm (Wasmtime v50.0.1 command adapter, WASI 0.2.12) executes real SQL through the wasmdown component runtime: `printf '.bail on\nSELECT 6*7;\n' | sbcl --script tools/wasmdown.lisp run tests/fixtures/wasi/sqlite3-p2.wasm --wasi -- -batch :memory:` prints 42, exit 0; a CREATE/INSERT/SELECT script prints 3|13.5; with `--dir DIR::/work` a database file is CREATED, a second process REOPENS it (3 rows), and the Preview1 build reads the SAME file (cross-ABI format compatibility). Without a preopen, opening a host path fails cleanly (exit 1, 'unable to open database file', no file created). Four defects were fixed to get here: (1) the CLI handed 0.3.2 providers to a 0.2.12 component — providers are now chosen from the DECLARED imports (component-command-providers); (2) %abi-store-variant matched a keyword domain tag against a string WIT case name and fell through to case 0, storing a NIL payload into the wrong case's resource slot (%abi-case-index); (3) the :enum domain shape is (list :enum LABEL) and both the store and the flat lower read (cdr v) — a one-element list — instead of the label; (4) result<T,E> layout: alignment hardcoded 4 and size dropped the discriminant, so a result<enum,error-code> (alignment 1, size 2) trapped 'unaligned pointer (store)' on the adapter's own retptr. Alignment and size had to change TOGETHER (one-sided changes broke E2E-STDOUT; both are pinned by component/abi-result-layout). Pins: component/abi-variant-tag-matching, component/abi-result-layout, wasi-p2-fixture/cli-provider-dispatch-follows-declared-imports."
wasi-http  = "REMOVED at user direction (PLAN.md M16 slice 5 / M17): this runtime ships no wasi:http client/service/listener implementation and no HTTP/TLS adapter; the vendored http WIT stays reference data only. Recoverable from git history."

wasi-lane  = "IMPLEMENTED (2026-10-31): tools/run-wasi-suite.py + `make test-wasi-preview2` / `make test-wasi` (+ the pre-existing `make test-wasi-preview1` acceptance script). The lane runs a manifest of behavioural cases against the REAL CLI, one fresh SBCL guest process per case, and writes tests/wasi-results/<dir>/results.jsonl (wasmdown.test-result.v1: suite, case_id, abi, fixture + SHA-256, backend, runtime + SBCL version, run, outcome, exit, elapsed) plus CONFORMANCE-WASI.md. It is a GATE: a case that cannot run (missing fixture, timeout, harness error) fails, nothing is skipped, and there is no retry-to-green; the checker itself is verified to go red on wrong stdout, wrong exit, a required non-zero status that is 0, and a file that must be absent. 11 Preview2 cases (argv/version via get-arguments, exact stdout `42` and `3|13.5`/`alpha,beta,gamma`, on-disk create + reopen in a second process, a database written through 0.2 read by the Preview1 build, no-preopen denial with no file created, read-only-preopen denial, a seeded SQL file read THROUGH a read-only preopen, guest diagnostics kept on stderr with a non-zero status, and a ~89 KiB / 20 000-line stdout exercising chunked stream writes) and 4 Preview1 cases (42, disk persist + reopen, denial) = 15 cases; the manifest is validated for DUPLICATE case ids and the summary carries a planned/executed census per ABI; a read-only preopen cannot open a SQLITE database: batch mode opens read-write (denied), -readonly still probes the journal ('disk I/O error (10)'), and this shell build lacks the -uri option, so file:...?mode=ro is unavailable; reading a plain file through it works and is the pinned case. Every run writes <output-dir>/summary.md; CONFORMANCE-WASI.md is written only with --commit-summary so a gate run cannot clobber the committed stability artifact. failing cases keep their exact guest artifacts (stdout/stderr/exit) under <output-dir>/failures/. measured 15/15 pass with the interpret backend; the plan's stability command `python3 tools/run-wasi-suite.py --abi all --repeat 30 --output-dir tests/wasi-results/final --commit-summary` reads 450/450 pass over 30 fresh-process runs (planned == executed per ABI: preview1 120/120, preview2 330/330), 520 s total and, under --backend baseline, the single component case p2/select-memory compiles its embedded core and prints 42 (exit 0, ~207 s), so the CLI's WASMDOWN_API_MODE now reaches component cores through run-component :mode rather than an unused environment read; the runner reserves 8 GB of SBCL dynamic space per guest (--heap-mb) because the baseline codegen of the 6 MB SQLite core exhausts 1 and 4 GB. KNOWN RED under --backend baseline (engine defect, not a lane defect): p1/disk-persist-reopen fails because the DB written by a baseline-compiled guest contains NO table afterwards. Reproduced standalone (not only inside the lane), with three independent readers on the same file: the guest itself reports 3 rows and exits 0; the file is 8192 bytes (bare header, initial size); the INTERPRET build reports 'no such table: t' (exit 1); host sqlite3 (reference reader only) also says 'no such table: t' and PRAGMA integrity_check reports 'Fragmentation of 64 bytes reported as 0 on page 1'. So the write path under compiled guest code never commits — it is not a path/mapping mix-up (same host directory, same /work path, and the file is present at reopen time), not a heap limit (8 GB reserved), and not the lane. Interpret-written databases are fine (created, reopened by a second process, read across ABIs), which is why the interpret lane is green. The lane reports the failure with the guest's stdout/stderr/exit under <output-dir>/failures/ and does not skip it; `make test-wasi` inherits whatever WASMDOWN_API_MODE selects. --repeat N starts fresh processes each run and keeps per-run records (see the final stability command in PLAN.md). tools/run-wasi-guest.lisp is the development guest driver: `--version` prints the loaded ASDF system version and command mode delegates to wasmdown.cli:main."

perf       = "MEASURED 2026-11-01 (this dev machine, SBCL 2.6.4, arm64; SQLite 3.54.1 :memory:/file). Interpret backend: startup 0.51 s (P1) / 0.58 s (P2) per process, of which decode+validate+instantiate is 0.09+0.10+0.04 s for the 6.2 MB component; a no-op query is 6.7 ms of guest time. Write benchmark (20 000-row recursive INSERT + aggregates + index, :memory:): CREATE 0.039 s, INSERT 10.24 s, count/sum 1.38 s, full scan 1.19 s, CREATE INDEX 4.85 s, indexed query 0.25 s -> 18.3 s wall for BOTH P1 and P2 (host sqlite3: 0.01 s, so ~1800x). Read benchmark on a 50 000-row file DB seeded by the interpreter: interpret 9.54 s of guest time / 10.35 s wall; baseline 1.65 s of guest time (5-10x faster per statement: aggregate 4.31->0.87 s, scan 0.83->0.083 s, sum(length(name)) 4.37->0.69 s, PK range 0.043->0.005 s) but 208.4 s wall because the baseline backend compiles the guest core at instantiation (~207 s, and needs an 8 GB dynamic space; 1 and 4 GB exhaust). So baseline pays back only when ONE process runs ~200 s+ of interpreter guest work (about 22x that read workload); for one-shot CLI runs interpret is ~20x cheaper end-to-end. Baseline WRITES are usable as of the 2026-11-01 codegen fix (see [wasi-preview2].baseline-writes): a baseline INSERT + SELECT now produces a host-readable DB (row present, PRAGMA integrity_check=ok), so the read benchmark can be repeated on a file DB the compiled guest itself writes. Earlier measurements above were taken while writes were still corrupt and are kept for provenance. Codegen fix landed on the way: %emit-load no longer emits a placeholder (f32-bits 0) on every float load (that call fired at runtime and broke the first f64.load). Lane times: make test 6.6 s, test-component 10.1 s, test-wasi 16.4 s, test-wasi-preview1 4.1 s, component census (30x) ~305 s, WASI repeat-30 ~520 s."

baseline-core = "MEASURED 2026-11-01, one fresh process per file, --backend baseline over the 97 pinned .wast files: 86 files fully green, 11 non-green and all PRE-EXISTING (identical counts with the pre-fix codegen, verified by A/B): call, call_indirect, fac, skip-stack-guard-page exhaust the control stack (no compiled return_call/return_call_indirect, so tail-recursive fixtures recurse on the host stack); instance (12/23 fail), return_call (34/51), return_call_indirect (50/83), table_grow (37/61), table_size (31/39), type-equivalence (9/32), type-rec (4/27). Under the interpret backend the same files pass. br_on_null.wast (10/10) and br_on_non_null.wast (12/12) newly pass under the compiled backend after the 2026-11-01 codegen work; br_table.wast passes (186/186) but needs ~70 s of compile time. NOTE: earlier sweeps stopped at br_table, so compiled-backend core coverage had never been measured past it - hence the honest count above."

baseline-writes = "FIXED (2026-11-01). A baseline-compiled guest wrote a SQLite page image whose b-tree cell-count byte stayed 0 while the in-session count(*) read 1. ROOT CAUSE: the compiled backend's streaming emitter pushed the LOCAL SYMBOL as the operand of `local.get`; a later local.set/local.tee of that same local rewrote the symbol before the consumer's form was emitted, so a consumer of an earlier read saw the NEW value (SQLite `++data[hdrOffset+4]` stored to address 5 - the post-increment local value - instead of the page buffer). The interpreter pushes VALUES, which is why only the compiled backend diverged. FIX (src/codegen.lisp): %CAPTURE-PENDING copies the current value into a temp at the WRITE whenever a pending operand still references the written local (and local.tee copies its own value when the tee value is that local), so earlier reads keep their value at zero per-read cost; a local never written needs no capture. VERIFIED: `(i32.store8 (local.get 0) (local.tee 0 (i32.const 42)))` regression test (tests/codegen.lisp codegen/mutable-local-operand-snapshot; 612/612 unit tests pass), and end to end with the P1 SQLite artifact on a host directory: CREATE+INSERT+SELECT gives `1`, host sqlite3 reads back 7 and PRAGMA integrity_check=ok, and a 20 000-row recursive-CTE INSERT prints 20000|100005000.0 while the host reads the same aggregates with integrity_check=ok. Also implemented at the same time: compiled-backend br_on_null/br_on_non_null, ref.as_non_null and call_ref/return_call_ref (br_on_null.wast 10/10 and br_on_non_null.wast 12/12 pass under the baseline backend)."
