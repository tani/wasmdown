# WASMDOWN pinned standards & conformance-suite manifest (PLAN.md §12.1).
# Machine-readable: keys are stable identifiers, values are exact pins.
# Policy: never use floating branches in release CI; a separate scheduled
# job tests newer upstream commits and proposes deliberate updates.

[spec.core]
name        = "WebAssembly Core Specification (source repository)"
repo        = "https://github.com/WebAssembly/spec"
commit      = "b0ec1f3f449525c217dbff3f1dfab435a756ea92"
commit_date = "2026-10-22"
vendored    = "tests/spec-core/*.wast  (97 files, test/core)"
note        = "Core 3.0 draft tree; authoritative source for core tests per PLAN.md §12.1"

[spec.testsuite-aggregate]
name        = "WebAssembly aggregated testsuite mirror"
repo        = "https://github.com/WebAssembly/testsuite"
commit      = "not-vendored"
note        = "Discovery-only mirror; core cases counted from WebAssembly/spec, never double-counted"

[component.model]
name        = "WebAssembly Component Model"
repo        = "https://github.com/WebAssembly/component-model"
commit      = "d095e2f60ddae1f9a1e9b1e2fb547ec1114da677"
commit_date = "2026-10-24"
vendored    = "tests/component/*.wast (75 files: async 45, binary 1, linking 4, resources 3, validation 14, values 8; nyi.txt carried) + specs/{Binary,CanonicalABI,WIT,Linking,Explainer}.md (design/mvp)"
note        = "M7 slices 1-5 + M8 + M9 + M10 + M11a + M11b + M12 IMPLEMENTED: the component binary reader + the validator (all validation rules through slice 5) + the component TEXT parser + component INSTANTIATION EXECUTION (M8) + THE LINKING SUITE (M9) + THE VALUES SUITE (M10) + THE ASYNC CORE (M11a: the task/thread state machine — the callback event loop, the backpressure gate, the deadlock oracle, the async built-ins, the packed async lower) + THE M11b CANON FAMILIES (the End record family: {stream,future}.new/read/write with the five-case End.copy + the BLOCKED sentinel, cancel-{read,write}, drop-{readable,writable}, forward with the outer-link + the both-pending corner + the empty-element take; the Table free list; the thread core: index/yield/suspend/resume-later + new-indirect's suspended spawn-thunk threads with the trap handler + the four -then-{resume,promote} variants; the three-shape STARTED semantics; the sync-lower two-sided type/handle split; the trap propagation; the {stream,future}.forward kind validation; the async dynamic context proclaimed at the file head) + THE M12 SCHEDULER SEMANTICS (the nested-sync-call handshake: every sync lift runs its core call through a FRESH executor SBCL thread bound to the per-call Task+implicit-Thread of §572, the caller DRAINING at the top level per §3538-3543 or PARKING when nested; the TWO-PARK split — thread.suspend parks with NO readiness on the suspend waitqueue per §494 (only an EXPLICIT resume may wake it; Store.tick's resume-all does NOT) vs thread.yield parks READY per §523 — with the NUDGE/RESUME split (the spawn-thunk firing moved out of the nudge into resume only per §4590); the RESUME-LATER TRAPS per §4605-4610 (the unknown-index OOB trap + the not-suspended trap); the ZOMBIE-JOIN TEARDOWNS at both oracle paths per §3552 (the thread marked ABANDONED — its three park sites unwind via the async-thread-abandoned condition — then unregistered, unblocked, JOINed: a store cannot leak its parked threads); the ATOMIC PACK EXIT (the STARTED-wait's exit and the state read captured together under the callee task's mutex); two pins: sync-lift-thread-context + suspend-vs-yield-determinism). 1449 pass / 0 fail / 0 unsupported / 0 harness-error minus nyi.txt — FULLY GREEN (27 async fixtures in the lane; M13 added async-calls-sync (3 rows — the aging quantum's deterministic interleave; its ~8-10% acs::1 lane flake is the RECORDED ACCEPTED RATE: the release-race surface measured by the 10-run/30-run FAILROW probe standards) + passing-resources (3 rows — the own-transfer chain's fixture) and closed the M12 residual's head: THE AGING QUANTUM (§922-941: one grant per tick in the creation-order path sort, the per-thread skip-age escape under the oracle's idle budget, the priority pass, the whole-store teardowns, the *print-circle* guard) + THE RESOLVE-STASH WINDOW (the trap rides the flat-results atomically) + THE TEARDOWN JOIN (the abandoned threads' deaths complete before the next script) + THE INTER-ROUND DRAIN (the suspend-then-resume arm's inter-round wake-count drain — the no-sibling resume window closed 0/50) + THE OWN-TRANSFER CHAIN (the stream-new canon's element single-resolution; the take/put own-transfer at the copy boundary; the guest-body borrow conversion per §2412; the resource builtin's borrow miss-walk — the resource crosses the stream with its rep, the borrow crosses the call, the drop through the borrowed record). The residual nyi ladder with the complete window captures: the timing-window family — switch-to-ready-callback 17 (the ::8 no-park GATE/STARTED-wait shape ~6-10%), during-sync-call-no-sibling-resume 6 (the resume window CLOSED; the residual unknown-thread-index variant ~3%), reentrance 25 (the state-read race; the sync-delivery candidate measured and reverted on the cancel-family's self-deadlock), sync-streams (the STARTING/STARTED embedder race), cancel-targeted-resume 10, cancel-subtask 4, cancel-delivery 4, cancel-resumed-callback-switch 4, partial-stream-copies, cross-abi-calls 49, big-interleaving-test 57, trap-if-block ::34 — THE M14 HAND-OFF: the token-scheduler determinism program (the sprint's two landed fixes + the four reverted candidates — the sync-delivery, the on-start deferral, the live-task gate, the ancestor gate — the captures are the recorded design evidence in nyi.txt). At M8+; vendor exact stable WIT snapshots + SHA-256 + M13-THE TOKEN SCHEDULER + M14 (the synchronous resume §761-770/§474-484, the pack window, the granted-park model §932, the per-instance cancel-window gate) + M15 (the granted park = grant AND readiness §932/§1373, the narrowed grant wake, the sync rendezvous §932 with %end-notify's durable sync-waiter wake, the two-space result store, the cancel-window fire gate, the gate's pending-cancel wake §681/§761, the sync-IO park's arm-time clear, the block depth counter + the guarded marker (the type-error class's site) + the refined drain predicate (a tick can help => spend it) + the oracle's quiescence rule) IMPLEMENTED: the component lane is 1631/0/0/0 (M7-M15; THE ASYNC SUITE COMPLETE — 45/45 files), units 414, core 21187/0/73; the probe metric maps the per-row rates (acs::1 ~7-10% ACCEPTED, switch-to-ready::8 ~11% pre-M15, during-sync-scheduling-candidates ~47% standalone at the base, cancel-targeted-resume::9, sync-streams::1, reentrance::14, big-interleaving::24)"

[toolchain]
sbcl        = "2.6.4"
architecture = "linux-aarch64 (dev); x86-64 primary per PLAN.md §1"
lisp_deps   = "0 mandatory Quicklisp/third-party"

[tooling.dev-only]
wabt        = "not pinned (test-only wast2json allowed per PLAN.md §12.2)"
wasm_tools  = "not pinned"
wasmtime    = "not pinned"

[status]
declared_support = "partial"
note = "Engine executes core subset: MVP + bulk-memory + sign-ext + non-trapping-float + multi-value + reference types + tail calls (return_call/return_call_indirect) + exception handling (tags, try_table, throw) + typed function references ((ref $t)/(ref null $t), call_ref/return_call_ref/br_on_null/br_on_non_null/ref.as_non_null, definite initialization) + rec type groups with canonicalization + iso-recursive equivalence + GC values END TO END (struct/array declarations AND opcodes: struct.new/get/set with packed normalization, array.* family, i31, ref.cast/ref.test/br_on_cast, ref.eq, any<->extern — self-authored tests; no vendored fixture) + multi-memory runtime + memory64 (memidx immediates on every memory op, cross-memory copy, i64 addressing — self-authored tests; no vendored fixture) + named module definition/instance script forms. The vendored core suite (97 files, pinned b0ec1f3f) is fully attributed: 21186 pass / 0 fail / 74 unsupported (annotations 73 = unadopted proposal, 1 SIMD fixture). NOT Core 3.0 conformant; Component Model / Canonical ABI (WIT), WASI, threads/atomics, FASL cache, annotations (unadopted proposal). SIMD (v128 + relaxed SIMD) IS implemented as of loop 24: valtype v128 (0x7B), the full 0xFD opcode family per BinarySIMD.md (236 v128 ops) plus the relaxed 0x100..0x113 set per the relaxed-simd Overview — text (v128.const shape literals, lane immediates, memarg+lane pairs, shuffle), binary decode/encode (u32-LEB sub-opcodes; the relaxed values multi-byte), validation (per-op signatures, lane bounds, addrtype-aware memarg checks), interp (scalarized lane execution over the one-object byte-vector representation, memory ops via the runtime's bounds-checked loads/stores). Relaxed ops implement the canonical deterministic member of each spec-sanctioned outcome set (documented per op at src/simd.lisp's exec + tests/simd.lisp pins): relaxed swizzle OOB=0, madd/nmadd plain two-rounding, min/max = non-relaxed fmin/fmax, q15mulr saturating, laneselect = bitselect, dot = 7-bit-unsigned b reading, relaxed trunc = saturating. Vendored coverage: obsolete-keywords::10 now PASSES at decode (21187/0/73); the rest of the SIMD surface is pinned by tests/simd.lisp (self-authored)."
